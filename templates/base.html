<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}HistoScan{% endblock %} · Breast Cancer Detection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%234b2a7b'/><circle cx='12' cy='13' r='4' fill='%23d4497e'/><circle cx='20' cy='19' r='3' fill='%23fbe5ee'/></svg>">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="{{ url_for('index') }}">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#4b2a7b"/><circle cx="11.5" cy="12.5" r="4.5" fill="#d4497e"/><circle cx="20.5" cy="19" r="3.5" fill="#fbe5ee"/><circle cx="19" cy="10" r="2" fill="#b79be0"/><circle cx="11" cy="21.5" r="2.2" fill="#b79be0"/></svg>
      HistoScan
    </a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav class="nav" id="nav">
      <a href="{{ url_for('index') }}" class="{{ 'on' if nav=='index' }}">Overview</a>
      <a href="{{ url_for('dataset') }}" class="{{ 'on' if nav=='dataset' }}">Dataset</a>
      <a href="{{ url_for('model_page') }}" class="{{ 'on' if nav=='model_page' }}">Model</a>
      <a href="{{ url_for('performance') }}" class="{{ 'on' if nav=='performance' }}">Performance</a>
      <a href="{{ url_for('history') }}" class="{{ 'on' if nav in ('history','report') }}">History</a>
      <a href="{{ url_for('about') }}" class="{{ 'on' if nav=='about' }}">About</a>
      <a href="{{ url_for('analyze') }}" class="cta">Analyze an image</a>
    </nav>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
  <div class="wrap">
    <span>Breast Cancer Detection and Classification Using Deep Learning · TY-IT Mini Project {{ year }}</span>
    <span>For research and education only. Not a medical device.</span>
  </div>
</footer>
<script>
const mb=document.getElementById('menuBtn'),nv=document.getElementById('nav');
mb.onclick=()=>{const o=nv.classList.toggle('open');mb.setAttribute('aria-expanded',o)};
</script>
{% block scripts %}{% endblock %}
</body>
</html>
